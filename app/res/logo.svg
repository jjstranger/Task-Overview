           inkscape:label="勾选框 Checkbox"
           x="116"
           y="375"
           width="40"
           height="40"
           rx="11"
           fill="#f3e2c0"
           stroke="#4a2c1a"
           stroke-width="5" />
        <rect
           id="task-2-bar"
           inkscape:label="彩条 Bar 2"
           x="172"
           y="380"
           width="186"
           height="30"
           rx="15"
           fill="#f7c948"
           stroke="#4a2c1a"
           stroke-width="5" />
      </g>
      <g
         id="task-3"
         inkscape:label="任务 3 Task 3">
        <rect
           id="task-3-checkbox"
           inkscape:label="勾选框 Checkbox"
           x="116"
           y="429"
           width="40"
           height="40"
           rx="11"
           fill="#f3e2c0"
           stroke="#4a2c1a"
           stroke-width="5" />
        <rect
           id="task-3-bar"
           inkscape:label="彩条 Bar 3"
           x="172"
           y="434"
           width="148"
           height="30"
           rx="15"
           fill="#2a9d8f"
           stroke="#4a2c1a"
           stroke-width="5" />
      </g>
